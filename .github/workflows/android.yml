name: Android

# Pushes to main publish a beta pre-release; pushing a tag like v0.2.0
# publishes a stable release. (Path filters don't apply to tag pushes.)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'static/**'
      - 'src-tauri/**'
      - 'crates/**'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must only ever go up, or Android refuses to install the APK as an update.
      # Offset keeps it above the 0.1.0 default (1000) used by earlier builds.
      - name: Compute version
        run: |
          version_code=$(( GITHUB_RUN_NUMBER + 1000 ))
          app_version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$app_version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match version $app_version in src-tauri/tauri.conf.json"
              exit 1
            fi
            version="$app_version"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_FLAGS=--latest" >> "$GITHUB_ENV"
          else
            version="$app_version-beta.$version_code"
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
            echo "RELEASE_FLAGS=--prerelease" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter one-sudoku

      # Every APK must be signed with the same key, or it can't update the
      # installed app.
      - name: Set up signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          cd src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build Android APK
        run: >-
          pnpm tauri android build --apk --target aarch64
          --config '{"version":"${{ env.VERSION }}","bundle":{"android":{"versionCode":${{ env.VERSION_CODE }}}}}'
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973

      - name: Collect APK
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -n1)
          test -n "$apk"
          cp "$apk" "one-sudoku-${VERSION}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "one-sudoku-${VERSION}.apk" \
            --target "$GITHUB_SHA" \
            --title "One Sudoku ${VERSION}" \
            --notes "Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            $RELEASE_FLAGS

      - name: Delete old betas
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | contains("-beta.")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
