[package]
name = "sudoku-solver"
version = "0.1.0"
edition = "2021"
description = "Constraint-based Sudoku solver with hint generation"
license = "MIT"
repository = "https://github.com/Vuurvos1/sudoku"
readme = "README.md"
keywords = ["sudoku", "solver", "puzzle", "hints"]
categories = ["games", "algorithms"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
rand = { version = "0.9", features = ["small_rng"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "solve"
harness = false
